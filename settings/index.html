<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px 14px 40px; }

    h2 { margin: 0 0 14px; font-size: 20px; }
    h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 600; }
    p.hint { margin: 0 0 16px; opacity: .65; font-size: 13px; line-height: 1.45; }

    .card { border-radius: 12px; overflow: hidden; background: rgba(128,128,128,.12); }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
           border-bottom: 1px solid rgba(128,128,128,.18); }
    .row:last-child { border-bottom: 0; }
    .row .grow { flex: 1; min-width: 0; }
    .row .time { font-size: 19px; }
    .row .sub { font-size: 12.5px; opacity: .6; margin-top: 2px; }

    /* Bryter bygget for hånd: en avkrysningsboks er for liten å treffe på
       telefon, som er der denne siden faktisk brukes. */
    .sw { position: relative; width: 50px; height: 30px; flex: none; cursor: pointer;
          border-radius: 15px; border: 2px solid currentColor; opacity: .45;
          transition: opacity .15s; background: transparent; }
    .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
          border-radius: 50%; background: currentColor; transition: transform .15s; }
    .sw.on { opacity: 1; }
    .sw.on::after { transform: translateX(20px); }
    .sw.busy { opacity: .25; cursor: default; }

    .link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
            color: #1f8fff; }
    .danger { color: #b3261e; }

    button.action { width: 100%; padding: 13px; margin-top: 12px; font-size: 15px;
            font-weight: 600; border-radius: 10px; cursor: pointer;
            border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; }
    button.primary { background: #1f8fff; border-color: #1f8fff; color: #fff; }
    button[disabled] { opacity: .5; cursor: default; }

    label.field { display: block; font-size: 12.5px; opacity: .65; margin: 14px 0 4px; }
    input[type="time"], input[type="text"], input[type="number"], select {
            width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px;
            border: 1px solid rgba(128,128,128,.35); border-radius: 8px;
            background: transparent; color: inherit; }
    input[type="range"] { width: 100%; box-sizing: border-box; padding: 0; border: 0;
            background: transparent; height: 30px; }

    /* Sju like kolonner, og flex inni hver rute så teksten står sentrert. */
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    .presets button { min-width: 0; height: 34px; padding: 0; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; cursor: pointer; border: 1px dashed rgba(128,128,128,.5);
            background: transparent; color: inherit; opacity: .85; overflow: hidden; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
    .days button { min-width: 0; height: 40px; padding: 0; font-size: 12.5px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; cursor: pointer; border: 1px solid rgba(128,128,128,.35);
            background: transparent; color: inherit; overflow: hidden; }
    .days button.on { background: #1f8fff; border-color: #1f8fff; color: #fff; }

    #msg { margin: 12px 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    #msg.bad { color: #b3261e; }
    #msg.ok { color: #157a3c; }
    .muted { opacity: .6; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div id="msg"></div>

<div id="listView">
  <h2 data-i18n="settings.alarms"></h2>
  <p class="hint" data-i18n="settings.intro"></p>
  <div id="rooms"></div>
  <button class="action primary" id="add" data-i18n="settings.addAlarm"></button>
  <button class="action" id="refresh" data-i18n="settings.refresh"></button>

  <h3 data-i18n="settings.connection"></h3>
  <div class="card">
    <div class="row">
      <div class="grow">
        <div id="hostLine" class="muted">—</div>
        <div class="sub" id="pollLine"></div>
      </div>
      <button class="link" id="editConn" data-i18n="settings.edit"></button>
    </div>
  </div>
</div>

<div id="formView" class="hidden">
  <h2 id="formTitle"></h2>

  <label class="field" data-i18n="pair.time"></label>
  <input type="time" id="f-time" value="07:00">

  <label class="field" data-i18n="pair.room"></label>
  <select id="f-room"></select>

  <label class="field" data-i18n="pair.sound"></label>
  <select id="f-source"></select>

  <label class="field" data-i18n="pair.days"></label>
  <!-- Hurtigvalg for de to vanligste mønstrene. -->
  <div class="presets">
    <button type="button" id="p-daily" data-days="0123456" data-i18n="pair.presetDaily"></button>
    <button type="button" id="p-weekdays" data-days="12345" data-i18n="pair.presetWeekdays"></button>
    <button type="button" id="p-weekends" data-days="06" data-i18n="pair.presetWeekends"></button>
  </div>
  <div class="days" id="f-days">
    <button type="button" class="on" data-day="1" data-key="mon"></button>
    <button type="button" class="on" data-day="2" data-key="tue"></button>
    <button type="button" class="on" data-day="3" data-key="wed"></button>
    <button type="button" class="on" data-day="4" data-key="thu"></button>
    <button type="button" class="on" data-day="5" data-key="fri"></button>
    <button type="button" data-day="6" data-key="sat"></button>
    <button type="button" data-day="0" data-key="sun"></button>
  </div>

  <label class="field"><span data-i18n="pair.volume"></span>: <span id="f-volValue">30</span>%</label>
  <input type="range" id="f-volume" min="0" max="100" step="1" value="30">

  <p class="hint" data-i18n="settings.soundHint"></p>

  <button class="action primary" id="save" data-i18n="settings.save"></button>
  <button class="action" id="cancel" data-i18n="settings.cancel"></button>
  <button class="action danger hidden" id="remove" data-i18n="settings.delete"></button>
</div>

<div id="connView" class="hidden">
  <h2 data-i18n="settings.connection"></h2>
  <p class="hint" data-i18n="settings.connectionHint"></p>

  <label class="field" data-i18n="settings.hostLabel"></label>
  <input type="text" id="c-host" placeholder="192.168.1.50" autocapitalize="off" spellcheck="false">

  <label class="field" data-i18n="settings.pollLabel"></label>
  <input type="number" id="c-poll" min="30" max="3600" placeholder="120">

  <button class="action primary" id="c-save" data-i18n="settings.save"></button>
  <button class="action" id="c-back" data-i18n="settings.cancel"></button>
</div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  var msgEl = document.getElementById('msg');
  var editingId = null;
  var editingSourceId = null;
  var rooms = [];
  var sources = [];

  function t(key) { return Homey.__(key); }

  // All statisk tekst kommer fra locales/. Appen er engelsk med norsk som
  // tilvalg, så ingenting skal stå hardkodet i markupen.
  var labelled = document.querySelectorAll('[data-i18n]');
  for (var n = 0; n < labelled.length; n++) {
    labelled[n].textContent = t(labelled[n].getAttribute('data-i18n'));
  }

  function show(text, cls) {
    msgEl.textContent = text || '';
    msgEl.className = cls || '';
  }

  function view(name) {
    document.getElementById('listView').className = name === 'list' ? '' : 'hidden';
    document.getElementById('formView').className = name === 'form' ? '' : 'hidden';
    document.getElementById('connView').className = name === 'conn' ? '' : 'hidden';
    show('');
  }

  // ---- liste ----

  function load() {
    show(t('settings.fetching'));
    Homey.api('GET', '/overview', null, function (error, data) {
      if (error) { show(t('settings.fetchFailed') + error, 'bad'); return; }
      show('');
      rooms = data.rooms || [];
      render(data);
    });
    // Kildene hentes ved siden av. Feiler de, skal alarmlista fortsatt vises —
    // man kan lese og slå av alarmer uten å kunne lage nye.
    Homey.api('GET', '/listSources', null, function (error, list) {
      if (error) {
        // Feilet dette stille, sto lydvelgeren tom uten at noe forklarte
        // hvorfor — og alarmlista ved siden av lastet helt fint.
        sources = [];
        show(t('error.noSourceList') + ' ' + error, 'bad');
        return;
      }
      sources = list || [];
    });
  }

  function render(data) {
    var container = document.getElementById('rooms');
    container.innerHTML = '';

    var alarms = data.alarms || [];
    if (alarms.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = t('settings.noAlarms');
      container.appendChild(empty);
      return;
    }

    // Gruppert per rom, slik Sonos-appen gjør det. Alarmer hvis rom ikke lar
    // seg slå opp havner under «ukjent rom» i stedet for å forsvinne.
    var order = [];
    var groups = {};
    for (var i = 0; i < alarms.length; i++) {
      var key = alarms[i].roomName || t('settings.unknownRoom');
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(alarms[i]);
    }
    order.sort();

    for (var j = 0; j < order.length; j++) {
      var title = document.createElement('h3');
      title.textContent = order[j];
      container.appendChild(title);

      var card = document.createElement('div');
      card.className = 'card';
      var list = groups[order[j]];
      list.sort(function (a, b) { return a.time.localeCompare(b.time); });
      for (var k = 0; k < list.length; k++) card.appendChild(rowFor(list[k]));
      container.appendChild(card);
    }
  }

  function rowFor(alarm) {
    var row = document.createElement('div');
    row.className = 'row';

    var grow = document.createElement('div');
    grow.className = 'grow';

    var time = document.createElement('div');
    time.className = 'time';
    time.textContent = alarm.time;

    var sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = alarm.recurrenceLabel + ' · '
      + (alarm.music ? t('settings.music') : t('settings.chime'));

    grow.appendChild(time);
    grow.appendChild(sub);
    grow.style.cursor = 'pointer';
    grow.addEventListener('click', function () { openForm(alarm); });

    var sw = document.createElement('div');
    sw.className = 'sw' + (alarm.enabled ? ' on' : '');
    sw.addEventListener('click', function () {
      if (sw.className.indexOf('busy') !== -1) return;
      var next = sw.className.indexOf('on') === -1;
      // Bryteren flyttes med én gang og rulles tilbake hvis kallet feiler:
      // å vente på nettverket gjør at den føles ødelagt.
      sw.className = 'sw busy' + (next ? ' on' : '');
      Homey.api('POST', '/setEnabled', { id: alarm.id, enabled: next }, function (error) {
        if (error) {
          sw.className = 'sw' + (alarm.enabled ? ' on' : '');
          show(t('settings.changeFailed') + error, 'bad');
          return;
        }
        alarm.enabled = next;
        sw.className = 'sw' + (next ? ' on' : '');
      });
    });

    row.appendChild(grow);
    row.appendChild(sw);
    return row;
  }

  // ---- skjema ----

  var dayButtons = document.getElementById('f-days').getElementsByTagName('button');
  function bindDay(button) {
    button.textContent = t('pair.' + button.getAttribute('data-key'));
    button.addEventListener('click', function () {
      button.className = button.className === 'on' ? '' : 'on';
    });
  }
  for (var d = 0; d < dayButtons.length; d++) bindDay(dayButtons[d]);

  // Hurtigvalgene SETTER utvalget, de legger ikke til.
  function bindPreset(id) {
    var button = document.getElementById(id);
    button.addEventListener('click', function () {
      var digits = button.getAttribute('data-days');
      for (var i = 0; i < dayButtons.length; i++) {
        var day = dayButtons[i].getAttribute('data-day');
        dayButtons[i].className = digits.indexOf(day) !== -1 ? 'on' : '';
      }
    });
  }
  bindPreset('p-daily');
  bindPreset('p-weekdays');
  bindPreset('p-weekends');

  function setDays(recurrence) {
    var days = [];
    if (recurrence === 'DAILY') days = [0, 1, 2, 3, 4, 5, 6];
    else if (recurrence === 'WEEKDAYS') days = [1, 2, 3, 4, 5];
    else if (recurrence === 'WEEKENDS') days = [0, 6];
    else if (recurrence && recurrence.indexOf('ON_') === 0) {
      var digits = recurrence.substring(3).split('');
      for (var i = 0; i < digits.length; i++) days.push(Number(digits[i]));
    }
    for (var j = 0; j < dayButtons.length; j++) {
      var day = Number(dayButtons[j].getAttribute('data-day'));
      dayButtons[j].className = days.indexOf(day) !== -1 ? 'on' : '';
    }
  }

  function recurrence() {
    var days = [];
    for (var i = 0; i < dayButtons.length; i++) {
      if (dayButtons[i].className === 'on') days.push(Number(dayButtons[i].getAttribute('data-day')));
    }
    days.sort(function (a, b) { return a - b; });
    if (days.length === 0) return null;
    if (days.length === 7) return 'DAILY';
    return 'ON_' + days.join('');
  }

  var volumeEl = document.getElementById('f-volume');
  var volumeValueEl = document.getElementById('f-volValue');
  function showVolume() { volumeValueEl.textContent = volumeEl.value; }
  volumeEl.addEventListener('input', showVolume);
  volumeEl.addEventListener('change', showVolume);

  function fillRooms(selected) {
    var select = document.getElementById('f-room');
    select.innerHTML = '';
    for (var i = 0; i < rooms.length; i++) {
      var option = document.createElement('option');
      option.value = rooms[i].uuid;
      option.textContent = rooms[i].name;
      if (rooms[i].uuid === selected) option.selected = true;
      select.appendChild(option);
    }
  }

  function fillSources(selected) {
    var select = document.getElementById('f-source');
    select.innerHTML = '';
    // Treffet må holdes rede på selv. Vi så tidligere etter «select.value» —
    // men et nedtrekk med valg har ALLTID en verdi: finner nettleseren ingen
    // som er merket valgt, velger den den første, og den første er alltid
    // pipetonen. Sjekken var derfor alltid usann, blokken under var død kode,
    // og en alarm som spilte noe utenfor favorittlista viste «Sonos-tone» —
    // og ble skrevet om til pipetonen ved neste lagring. Metadataen som gikk
    // tapt der kan ikke gjenskapes.
    var matched = false;
    for (var i = 0; i < sources.length; i++) {
      var option = document.createElement('option');
      option.value = sources[i].id;
      option.textContent = sources[i].label || sources[i].title;
      if (selected && sources[i].id === selected) {
        option.selected = true;
        matched = true;
      }
      select.appendChild(option);
    }
    // Alarmen kan spille noe som ikke lenger står blant favorittene — da er
    // valget hverken i lista eller mulig å gjenskape, så det vises som det er
    // framfor å bli stille byttet til den første i lista.
    if (selected && !matched) {
      var current = document.createElement('option');
      current.value = selected;
      current.textContent = t('settings.music');
      current.selected = true;
      select.appendChild(current);
    }
    if (sources.length === 0) {
      var fallback = document.createElement('option');
      fallback.value = 'buzzer';
      fallback.textContent = t('settings.chime');
      select.appendChild(fallback);
    }
  }

  function openForm(alarm) {
    editingId = alarm ? alarm.id : null;
    // Lyden alarmen hadde da skjemaet ble åpnet. Sendes med ved lagring slik at
    // appen kan se at lyden ikke er endret, og la den stå urørt hvis den ikke
    // lenger finnes blant favorittene.
    editingSourceId = alarm ? alarm.sourceId : null;
    document.getElementById('formTitle').textContent =
      t(alarm ? 'settings.editAlarm' : 'settings.newAlarm');
    document.getElementById('remove').className = alarm ? 'action danger' : 'action danger hidden';
    document.getElementById('f-time').value = alarm ? alarm.time : '07:00';
    volumeEl.value = alarm ? alarm.volume : 30;
    showVolume();
    setDays(alarm ? alarm.recurrence : 'WEEKDAYS');
    fillRooms(alarm ? alarm.groupUUID : null);
    fillSources(alarm ? alarm.sourceId : null);

    // Rommet låses på en alarm som finnes: Sonos knytter alarmen til en bestemt
    // høyttaler, og å flytte den er en annen operasjon enn å endre innholdet.
    // Lyden er derimot fri — den skrives om på samme måte som når en alarm
    // oppdateres fra en rom-enhet, og den veien er verifisert.
    document.getElementById('f-room').disabled = !!alarm;
    view('form');
  }

  document.getElementById('add').addEventListener('click', function () {
    if (rooms.length === 0) { show(t('error.noRooms'), 'bad'); return; }
    openForm(null);
  });
  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('cancel').addEventListener('click', function () { view('list'); load(); });

  document.getElementById('save').addEventListener('click', function () {
    var repeat = recurrence();
    if (!repeat) { show(t('error.noDays'), 'bad'); return; }

    var saveBtn = document.getElementById('save');
    saveBtn.disabled = true;
    show(t('settings.saving'));

    var done = function (error) {
      saveBtn.disabled = false;
      if (error) { show(t('settings.saveFailed') + error, 'bad'); return; }
      view('list');
      load();
    };

    if (editingId) {
      Homey.api('POST', '/updateAlarm', {
        id: editingId,
        time: document.getElementById('f-time').value,
        recurrence: repeat,
        volume: Number(volumeEl.value),
        sourceId: document.getElementById('f-source').value || undefined,
        currentSourceId: editingSourceId || undefined
      }, done);
    } else {
      Homey.api('POST', '/createAlarm', {
        roomUUID: document.getElementById('f-room').value,
        time: document.getElementById('f-time').value,
        recurrence: repeat,
        volume: Number(volumeEl.value),
        enabled: true,
        sourceId: document.getElementById('f-source').value || 'buzzer'
      }, done);
    }
  });

  document.getElementById('remove').addEventListener('click', function () {
    if (!editingId) return;
    var button = this;
    // Sletting er ikke reversibel, og alarmen forsvinner også fra Sonos-appen.
    // Homey.confirm, ikke nettleserens confirm: innstillingssiden lever inne i
    // Homey-appen, og en innebygd dialog hører hjemme der.
    Homey.confirm(t('settings.deleteConfirm'), function (confirmError, ok) {
      if (confirmError || !ok) return;
      // Knappen låses mens kallet går. Et nytt trykk ville sendt DestroyAlarm
      // på nytt for en id som alt er borte.
      button.disabled = true;
      Homey.api('POST', '/deleteAlarm', { id: editingId }, function (error) {
        button.disabled = false;
        if (error) { show(t('settings.deleteFailed') + error, 'bad'); return; }
        view('list');
        load();
      });
    });
  });

  // ---- tilkobling ----

  function loadConn() {
    Homey.get('speakerHost', function (error, value) {
      var host = (!error && value) ? value : '';
      document.getElementById('c-host').value = host;
      document.getElementById('hostLine').textContent = host || t('settings.autoHost');
    });
    Homey.get('pollSeconds', function (error, value) {
      var poll = (!error && value) ? value : 120;
      document.getElementById('c-poll').value = poll;
      document.getElementById('pollLine').textContent =
        t('settings.pollLine') + ' ' + poll + ' ' + t('settings.seconds');
    });
  }

  document.getElementById('editConn').addEventListener('click', function () { view('conn'); });
  document.getElementById('c-back').addEventListener('click', function () { view('list'); });

  document.getElementById('c-save').addEventListener('click', function () {
    var host = document.getElementById('c-host').value.trim();
    var poll = Number(document.getElementById('c-poll').value) || 120;
    // Tom betyr «finn en høyttaler selv» og er gyldig. En adresse som ikke er
    // IPv4 blir derimot stille forkastet lenger inne, mens siden viste den som
    // om den var i bruk — så den avvises her, slik paringen alt gjør.
    if (host && !/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) {
      show(t('error.badAddress'), 'bad');
      return;
    }
    Homey.set('speakerHost', host, function (error) {
      if (error) { show(String(error), 'bad'); return; }
      Homey.set('pollSeconds', poll, function (secondError) {
        if (secondError) { show(String(secondError), 'bad'); return; }
        loadConn();
        view('list');
        load();
      });
    });
  });

  loadConn();
  load();
  Homey.ready();
}
</script>
</body>
</html>
