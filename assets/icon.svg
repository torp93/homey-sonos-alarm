<!--
  Appikonet: Sonos-ordmerket.

  Rendres som en maske — Homey bruker bare alfakanalen og fargelegger formen
  med brandColor. Derfor ingen fyllfarge og ingen bakgrunn her; en bakgrunnsflate
  ville fylt hele ruten og slukt bokstavene.

  viewBox er utvidet til et kvadrat rundt originalen (52.13 bred, 11.7 høy) slik
  at merket står sentrert. Padden er (52.13 - 11.7) / 2 = 20.215 i hver ende.
  Et ordmerke som er fire og en halv gang bredere enn det er høyt kan ikke fylle
  et kvadratisk lerret uten å strekkes, så det blir stående lavt — det er formens
  natur, ikke en feil.

  Merk: flow-kort UTEN et enhetsargument arver dette ikonet, og `icon` på et
  enkelt kort validerer men ignoreres. Endres denne, endres de kortene også.
-->
