<!--
  Steg 2: legge til en alarm som finnes, eller lage en ny.

  All tekst hentes fra locales/. Appen er engelsk med norsk som tilvalg.

  Homey injiserer homey.js selv — ikke legg den inn her.
-->
<style>
  .sa { padding: 0 16px; line-height: 1.5; overflow-x: hidden; }
  .sa * { max-width: 100%; box-sizing: border-box; }
  .sa p { margin: 0 0 18px; }
  .sa button { display: block; width: 100%; padding: 14px; margin-bottom: 12px;
               font-size: 0.95em; border-radius: 6px; cursor: pointer; text-align: left;
               border: 1px solid rgba(128,128,128,0.4); background: transparent; color: inherit; }
  .sa button strong { display: block; margin-bottom: 3px; }
  .sa button span { opacity: 0.7; font-size: 0.88em; }
  .sa button.primary { background: #1D1D1D; border-color: #1D1D1D; color: #fff; }
  .sa button.primary span { opacity: 0.75; }
</style>

<div class="sa">
  <p id="intro"></p>

  <button id="existing" class="primary">
    <strong id="existingTitle"></strong>
    <span id="existingHint"></span>
  </button>

  <button id="new">
    <strong id="newTitle"></strong>
    <span id="newHint"></span>
  </button>
</div>

<script type="application/javascript">
// Egen funksjon per visning: alle paringsvisningene deler ett globalt skop.
(function () {
  function t(key) { return Homey.__('pair.' + key); }

  try { Homey.setTitle(t('chooseTitle')); } catch (error) { /* pynt */ }

  document.getElementById('intro').textContent = t('chooseIntro');
  document.getElementById('existingTitle').textContent = t('chooseExisting');
  document.getElementById('existingHint').textContent = t('chooseExistingHint');
  document.getElementById('newTitle').textContent = t('chooseNew');
  document.getElementById('newHint').textContent = t('chooseNewHint');

  document.getElementById('existing')
    .addEventListener('click', function () { Homey.showView('list_devices'); });

  document.getElementById('new')
    .addEventListener('click', function () { Homey.showView('create'); });
})();
</script>
