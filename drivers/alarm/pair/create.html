<!--
  Steg 3a: lag en ny alarm.

  Skrevet defensivt etter at en tidligere utgave feilet stille i paringsvinduet:
  dagsknappene ble bygget i JavaScript, og da skriptet kastet der, forsvant ALT
  som kom etter — knappene, volumlytteren og hentingen av rom. Symptomet var tre
  urelaterte «feil» med én årsak, og ingen feilmelding noe sted. Derfor ligger
  knappene i HTML, skriptet er ES5 i en egen funksjon, og window.onerror
  skriver feilen synlig på siden.

  All tekst hentes fra locales/. Appen er engelsk med norsk som tilvalg.

  Homey injiserer homey.js selv — ikke legg den inn her.
-->
<style>
  .sa { padding: 0 16px; line-height: 1.5; overflow-x: hidden; }
  .sa * { max-width: 100%; box-sizing: border-box; }
  .sa label { display: block; margin: 14px 0 4px; font-size: 0.9em; opacity: 0.75; }
  .sa select, .sa input[type="time"] { width: 100%; padding: 9px 10px; font-size: 1em;
              border: 1px solid rgba(128,128,128,0.4); border-radius: 6px;
              background: transparent; color: inherit; }
  /* Ramme og innvendig luft må IKKE gjelde skyveren: da tegnes sporet et annet
     sted enn der kontrollen ligger, og den ser fastlåst ut når man drar. */
  .sa input[type="range"] { width: 100%; padding: 0; border: 0;
              background: transparent; height: 30px; }
  /* Grid, ikke flex: med «flex: 1» krymper ikke knappene under tekstbredden,
     og den sjuende havner utenfor skjermen. */
  .sa .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .sa .presets button { min-width: 0; height: 32px; padding: 0; font-size: 0.78em;
              display: flex; align-items: center; justify-content: center;
              border-radius: 6px; cursor: pointer; border: 1px dashed rgba(128,128,128,0.5);
              background: transparent; color: inherit; opacity: 0.85; overflow: hidden; }
  .sa .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
  /* Flex i hver rute sentrerer teksten både vannrett og loddrett. Uten dette
     satt dagene skjevt, siden knappene er smale og teksten ulik i bredde. */
  .sa .days button { min-width: 0; height: 38px; padding: 0; font-size: 0.8em;
              display: flex; align-items: center; justify-content: center;
              text-align: center; border-radius: 6px; cursor: pointer;
              border: 1px solid rgba(128,128,128,0.4);
              background: transparent; color: inherit; overflow: hidden; }
  /* Aksentblå, ikke nesten-svart: en mørk markering forsvinner i mørkt tema,
     og da ser valgte dager ut som de ikke er valgt. */
  .sa .days button.on { background: #1f8fff; border-color: #1f8fff; color: #fff; }
  .sa .buttons { display: flex; gap: 10px; margin-top: 20px; }
  .sa .buttons button { flex: 1; padding: 10px; font-size: 0.95em; border-radius: 6px;
              cursor: pointer; border: 1px solid rgba(128,128,128,0.4);
              background: transparent; color: inherit; }
  .sa .buttons button.primary { background: #1D1D1D; border-color: #1D1D1D; color: #fff; }
  .sa button[disabled] { opacity: 0.5; cursor: default; }
  .sa .small { margin-top: 6px; padding: 6px 10px; font-size: 0.82em; border-radius: 6px;
              cursor: pointer; border: 1px solid rgba(128,128,128,0.4);
              background: transparent; color: inherit; width: auto; }
  .sa #result { margin-top: 16px; white-space: pre-wrap; font-size: 0.88em; }
  .sa #result.bad { color: #c0392b; }
  .sa #result.ok { color: #1a8a3c; }
</style>

<div class="sa">
  <div id="result"></div>

  <label for="room" id="roomLabel"></label>
  <select id="room"></select>
  <button id="reload" class="small" type="button"></button>

  <label for="source" id="soundLabel"></label>
  <select id="source"></select>

  <label for="time" id="timeLabel"></label>
  <input id="time" type="time" value="07:00">

  <label id="daysLabel"></label>
  <!-- Hurtigvalg: ukedager og helg er de to vanligste, og sju enkelttrykk for
       dem er unødvendig tungvint. -->
  <div class="presets">
    <button type="button" id="p-daily" data-days="0123456"></button>
    <button type="button" id="p-weekdays" data-days="12345"></button>
    <button type="button" id="p-weekends" data-days="06"></button>
  </div>
  <!-- Ligger i HTML, ikke bygget i JS: en feil i skriptet skal ikke kunne
       etterlate en tom rad. data-day er Sonos sin nummerering, søndag er 0. -->
  <div class="days" id="days">
    <button type="button" class="on" data-day="1" data-key="mon"></button>
    <button type="button" class="on" data-day="2" data-key="tue"></button>
    <button type="button" class="on" data-day="3" data-key="wed"></button>
    <button type="button" class="on" data-day="4" data-key="thu"></button>
    <button type="button" class="on" data-day="5" data-key="fri"></button>
    <button type="button" data-day="6" data-key="sat"></button>
    <button type="button" data-day="0" data-key="sun"></button>
  </div>

  <label for="volume"><span id="volumeLabel"></span>: <span id="volumeValue">30</span></label>
  <input id="volume" type="range" min="0" max="100" step="1" value="30">

  <div class="buttons">
    <button id="back" type="button"></button>
    <button id="create" class="primary" type="button"></button>
  </div>
</div>

<script type="application/javascript">
// Egen funksjon per visning: alle paringsvisningene deler ett globalt skop.
(function () {
  var resultEl = document.getElementById('result');

  function show(text, cls) {
    if (!resultEl) return;
    resultEl.textContent = text;
    resultEl.className = cls || '';
  }

  function t(key) { return Homey.__('pair.' + key); }

  // Uten dette feiler siden stille, og flere ting ser ødelagte ut samtidig
  // uten at noen av dem er den egentlige feilen.
  window.onerror = function (message, source, line) {
    show(t('scriptError') + message + ' (' + line + ')', 'bad');
    return false;
  };

  try { Homey.setTitle(t('newTitle')); } catch (error) { /* pynt */ }

  var roomEl = document.getElementById('room');
  var sourceEl = document.getElementById('source');
  var timeEl = document.getElementById('time');
  var volumeEl = document.getElementById('volume');
  var volumeValueEl = document.getElementById('volumeValue');
  var createBtn = document.getElementById('create');

  document.getElementById('roomLabel').textContent = t('room');
  document.getElementById('soundLabel').textContent = t('sound');
  document.getElementById('timeLabel').textContent = t('time');
  document.getElementById('daysLabel').textContent = t('days');
  document.getElementById('volumeLabel').textContent = t('volume');
  document.getElementById('reload').textContent = t('reloadRooms');
  document.getElementById('back').textContent = t('back');
  createBtn.textContent = t('create');

  var dayButtons = document.getElementById('days').getElementsByTagName('button');

  function bindDay(button) {
    button.textContent = t(button.getAttribute('data-key'));
    button.addEventListener('click', function () {
      button.className = button.className === 'on' ? '' : 'on';
    });
  }
  for (var i = 0; i < dayButtons.length; i++) bindDay(dayButtons[i]);

  // Hurtigvalgene SETTER utvalget i stedet for å legge til, så to trykk aldri
  // gir en blanding brukeren ikke ba om.
  function applyPreset(digits) {
    for (var j = 0; j < dayButtons.length; j++) {
      var day = dayButtons[j].getAttribute('data-day');
      dayButtons[j].className = digits.indexOf(day) !== -1 ? 'on' : '';
    }
  }

  function bindPreset(id, key) {
    var button = document.getElementById(id);
    button.textContent = t(key);
    button.addEventListener('click', function () {
      applyPreset(button.getAttribute('data-days'));
    });
  }

  bindPreset('p-daily', 'presetDaily');
  bindPreset('p-weekdays', 'presetWeekdays');
  bindPreset('p-weekends', 'presetWeekends');

  function showVolume() { volumeValueEl.textContent = volumeEl.value; }
  volumeEl.addEventListener('input', showVolume);
  volumeEl.addEventListener('change', showVolume);

  // Samme regel som i lib/recurrence.js: alle sju dager er DAILY, ikke ON_0123456.
  function recurrence() {
    var days = [];
    for (var j = 0; j < dayButtons.length; j++) {
      if (dayButtons[j].className === 'on') days.push(Number(dayButtons[j].getAttribute('data-day')));
    }
    days.sort(function (a, b) { return a - b; });
    if (days.length === 0) return null;
    if (days.length === 7) return 'DAILY';
    return 'ON_' + days.join('');
  }

  var roomsLoaded = false;

  function loadRooms() {
    roomsLoaded = false;
    roomEl.innerHTML = '<option value="">' + t('loading') + '</option>';
    show('', '');

    // Uten denne blir «Laster …» stående for alltid hvis kallet henger, og man
    // ser ingen forskjell på tregt og ødelagt.
    var timer = setTimeout(function () {
      if (!roomsLoaded) show(t('noAnswer'), 'bad');
    }, 12000);

    Homey.emit('getRooms', null, function (error, rooms) {
      clearTimeout(timer);
      roomsLoaded = true;
      roomEl.innerHTML = '';

      if (error) { show(t('roomsFailed') + (error.message || error), 'bad'); return; }
      rooms = rooms || [];
      for (var k = 0; k < rooms.length; k++) {
        var option = document.createElement('option');
        option.value = rooms[k].uuid;
        option.textContent = rooms[k].name;
        roomEl.appendChild(option);
      }
      if (rooms.length === 0) show(t('noRoomsFound'), 'bad');
    });
  }

  // Kildene hentes ved siden av rommene. Feiler de, faller vi tilbake på den
  // innebygde tonen framfor å blokkere hele skjemaet.
  function loadSources() {
    sourceEl.innerHTML = '<option value="buzzer">' + t('loading') + '</option>';
    Homey.emit('getSources', null, function (error, list) {
      if (error || !list || list.length === 0) {
        sourceEl.innerHTML = '<option value="buzzer">Sonos chime</option>';
        return;
      }
      sourceEl.innerHTML = '';
      for (var m = 0; m < list.length; m++) {
        var option = document.createElement('option');
        option.value = list[m].id;
        option.textContent = list[m].label || list[m].title;
        sourceEl.appendChild(option);
      }
    });
  }

  document.getElementById('reload').addEventListener('click', function () {
    loadRooms();
    loadSources();
  });
  document.getElementById('back').addEventListener('click', function () {
    Homey.showView('choose');
  });

  createBtn.addEventListener('click', function () {
    var repeat = recurrence();
    if (!repeat) { show(t('pickDay'), 'bad'); return; }
    if (!roomEl.value) { show(t('pickRoom'), 'bad'); return; }

    createBtn.disabled = true;
    show(t('creating'), '');

    Homey.emit('createAlarm', {
      roomUUID: roomEl.value,
      startTime: timeEl.value,
      recurrence: repeat,
      volume: Number(volumeEl.value),
      enabled: true,
      sourceId: sourceEl.value || 'buzzer'
    }, function (error, device) {
      if (error) {
        createBtn.disabled = false;
        show(t('createFailed') + (error.message || error), 'bad');
        return;
      }
      show(t('created'), 'ok');
      Homey.createDevice(device, function (createError) {
        if (createError) {
          // Alarmen finnes nå i Sonos selv om Homey-enheten feilet. Å si det
          // høyt sparer brukeren for å lage den samme alarmen om igjen.
          createBtn.disabled = false;
          show(t('createdButDeviceFailed') + (createError.message || createError)
             + t('addManually'), 'bad');
          return;
        }
        Homey.done();
      });
    });
  });

  loadRooms();
  loadSources();
})();
</script>
