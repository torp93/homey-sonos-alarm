<!--
  Steg 1: finn en Sonos-høyttaler.

  Alarmlista er husholdnings-global, så det holder å nå én høyttaler — hvilken
  som helst svarer for alle. Derfor er dette ett steg og ikke et valg per rom.

  SSDP fungerer fordi appen kjører på Homey, som står på samme LAN. Manuell
  adresse er likevel med: multicast blir borte over enkelte VLAN-oppsett.

  All tekst hentes fra locales/. Appen er engelsk med norsk som tilvalg.

  Homey injiserer homey.js selv — ikke legg den inn her.
-->
<style>
  .sa { padding: 0 16px; line-height: 1.5; overflow-x: hidden; }
  .sa * { max-width: 100%; box-sizing: border-box; }
  .sa p { margin: 0 0 14px; }
  .sa label { display: block; margin: 14px 0 4px; font-size: 0.9em; opacity: 0.75; }
  .sa input { width: 100%; padding: 9px 10px; font-size: 1em;
              border: 1px solid rgba(128,128,128,0.4); border-radius: 6px;
              background: transparent; color: inherit; }
  .sa .buttons { display: flex; gap: 10px; margin-top: 18px; }
  .sa .buttons button { flex: 1; padding: 10px; font-size: 0.95em; border-radius: 6px;
               cursor: pointer; border: 1px solid rgba(128,128,128,0.4);
               background: transparent; color: inherit; }
  .sa .buttons button.primary { background: #1D1D1D; border-color: #1D1D1D; color: #fff; }
  .sa button[disabled] { opacity: 0.5; cursor: default; }
  .sa #result { margin-top: 16px; white-space: pre-wrap; font-size: 0.88em; line-height: 1.45; }
  .sa #result.ok { color: #1a8a3c; }
  .sa #result.bad { color: #c0392b; }
</style>

<div class="sa">
  <p id="intro"></p>

  <label for="host" id="addressLabel"></label>
  <input id="host" type="text" inputmode="url" autocapitalize="off" autocorrect="off"
         spellcheck="false" placeholder="192.168.1.50">

  <div class="buttons">
    <button id="scan"></button>
    <button id="next" class="primary"></button>
  </div>

  <div id="result"></div>
</div>

<script type="application/javascript">
// Egen funksjon per visning: alle paringsvisningene deler ett globalt skop, og
// to visninger som deklarerer samme navn med const kaster hele skriptet.
(function () {
  function t(key) { return Homey.__('pair.' + key); }

  try { Homey.setTitle(t('findTitle')); } catch (error) { /* pynt */ }

  var hostEl = document.getElementById('host');
  var resultEl = document.getElementById('result');
  var scanBtn = document.getElementById('scan');
  var nextBtn = document.getElementById('next');

  document.getElementById('intro').textContent = t('findIntro');
  document.getElementById('addressLabel').textContent = t('addressLabel');
  scanBtn.textContent = t('searchAgain');
  nextBtn.textContent = t('continue');

  function show(text, cls) {
    resultEl.textContent = text;
    resultEl.className = cls || '';
  }

  function scan() {
    show(t('searching'), '');
    scanBtn.disabled = true;
    Homey.emit('discover', null, function (error, found) {
      scanBtn.disabled = false;
      if (error) { show(t('searchFailed') + (error.message || error), 'bad'); return; }
      var hosts = (found && found.hosts) || [];
      if (hosts.length === 0) { show(t('noneFound'), 'bad'); return; }
      hosts.sort();
      hostEl.value = hosts[0];
      show(t('found') + '\n' + hosts.join('\n'), 'ok');
    });
  }

  scanBtn.addEventListener('click', scan);

  // Har appen allerede en høyttaler, er et nytt søk bortkastet ventetid.
  Homey.emit('currentSpeaker', null, function (error, current) {
    if (!error && current && current.host) {
      hostEl.value = current.host;
      show(t('usingKnown'), 'ok');
      return;
    }
    scan();
  });

  nextBtn.addEventListener('click', function () {
    var host = hostEl.value.trim();
    if (!host) { show(t('enterAddress'), 'bad'); return; }
    nextBtn.disabled = true;
    show(t('connecting'), '');
    Homey.emit('saveHost', { host: host }, function (error) {
      nextBtn.disabled = false;
      if (error) { show(t('noContact') + (error.message || error), 'bad'); return; }
      // Null alarmer er ikke en blindvei: neste skjerm tilbyr å lage en.
      Homey.showView('choose');
    });
  });
})();
</script>
